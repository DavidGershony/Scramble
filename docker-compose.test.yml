services:
  nostr-relay:
    image: scsibug/nostr-rs-relay:latest
    ports:
      - "7777:8080"
    volumes:
      - relay-data:/usr/src/app/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'healthy'"]
      interval: 2s
      timeout: 5s
      retries: 3
      start_period: 3s

  whitenoise:
    build:
      context: ./tests/whitenoise-docker
      dockerfile: Dockerfile
    container_name: whitenoise-interop
    volumes:
      - wn-data:/data
      - wn-logs:/logs
    depends_on:
      nostr-relay:
        condition: service_healthy
    environment:
      - RUST_LOG=info,whitenoise=debug,mdk_core=debug

  # The Dark Matter reference peer. Separate from the `whitenoise` service
  # above, which is the pre-Dark-Matter daemon; both exist while the migration
  # is in flight. Pinned to a tag, not a branch — see the Dockerfile.
  wn-agent:
    build:
      context: ./tests/wn-agent-docker
      dockerfile: Dockerfile
      args:
        MDK_REF: ${MDK_REF:-wn-agent-v0.9.17}
    container_name: wn-agent-interop
    # Host networking is required, not a shortcut. The agent accepts plaintext
    # ws:// relays only for a literal loopback host and rejects private ranges,
    # so it cannot reach the relay at its bridge address or by service name. On
    # the host network the relay's published port is 127.0.0.1:7777, which the
    # agent accepts.
    network_mode: host
    volumes:
      - wn-agent-data:/data
    depends_on:
      nostr-relay:
        condition: service_healthy
    environment:
      - RUST_LOG=info,cgka_engine=debug,agent_connector=debug
      # Without this, `bootstrap` emits an invite nprofile pointing at the
      # public WhiteNoise relays, which nothing in the test network can reach.
      - MARMOT_RELAYS=ws://127.0.0.1:7777
    healthcheck:
      # Ready means the control socket exists, not merely that the process
      # started: tests drive it through that socket immediately.
      test: ["CMD-SHELL", "test -S /run/marmot-agent/wn-agent.sock"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # The Marmot reference CLI client - the Dark Matter peer that can actually
  # complete an invite. See tests/mdk-cli-docker/Dockerfile for why this exists
  # alongside the other two.
  mdk-cli:
    build:
      context: ./tests/mdk-cli-docker
      dockerfile: Dockerfile
      args:
        MDK_REF: ${MDK_REF:-wn-agent-v0.9.17}
    image: scramble-mdk-cli:latest
    container_name: mdk-cli-interop
    # Host networking for the same reason as wn-agent: the stack accepts a
    # plaintext ws:// relay only for a literal loopback host, so it cannot reach
    # the relay at its bridge address or by service name. On the host network
    # the relay's published port is 127.0.0.1:7777.
    network_mode: host
    volumes:
      - mdk-cli-data:/data
      - mdk-cli-logs:/logs
    depends_on:
      nostr-relay:
        condition: service_healthy
    environment:
      - RUST_LOG=info,cgka_engine=debug,marmot_app=debug
      # The stack refuses plaintext loopback relays by default - the CLI has no
      # flag for it, only this env var. Without it every relay URL we can offer
      # a container is rejected as invalid_relay_url.
      - WN_ALLOW_LOOPBACK_RELAYS=1
    healthcheck:
      # The image idles; ready means the binaries are present and runnable.
      test: ["CMD-SHELL", "wn --version >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

volumes:
  relay-data:
  wn-data:
  wn-logs:
  wn-agent-data:
  mdk-cli-data:
  mdk-cli-logs:
