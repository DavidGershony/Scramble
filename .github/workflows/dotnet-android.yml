name: Android head (required)

# Why this exists: until 2026-09-20, nothing in CI compiled the Android head on a
# PR. `dotnet-desktop.yml` passes DesktopOnly=true, which excludes it by design;
# `drift.yml` only path-filters src/Scramble.Mobile.Android/** to police shell
# purity and never builds; `publish.yml` does build it, but only on a `v*` tag or a
# manual dispatch. So the head the P11 cutover plan designates as *leading* the
# migration could break on master and nobody would learn until release day.
#
# It is deliberately NOT path-filtered. Almost anything in Scramble.Core,
# Scramble.Presentation or Scramble.UI can break this head — the mobile project is
# a thin shell that multi-targets the shared views — so "which paths affect
# Android" is very nearly "all of them", and a filter would mostly serve to hide
# the breakage it was meant to catch.
#
# Two jobs, and the difference between them is the whole point. `android` proves
# the head compiles. `smoke` boots an emulator, installs it and checks it is still
# running with its own UI on screen -- because Avalonia-on-Android fails at
# startup, not at compile time, and until 2026-09-22 nothing had ever started it.
#
# What `smoke` covers, precisely: the app launches, survives 30 seconds, owns the
# resumed activity, logs no FATAL EXCEPTION, and is not killed by the
# lowmemorykiller. That is "does it run at all", which was the open question.
#
# What it still does NOT cover, and I5's exit condition names it: a scripted
# create-group / send-message pass. Startup exercises storage, the Keystore and
# engine construction; it does not exercise the protocol. Read a green tick here
# as "the head runs", not as the freeze having lifted on its own.

# ReactiveUI / Splat NuGet packages have a revoked author signing certificate.
# Linux .NET SDK does full OCSP/CRL checking via OpenSSL, which nuget.config's
# signatureValidationMode=accept cannot suppress. Mirrors publish.yml and
# integration.yml, both of which hit this on ubuntu runners.
env:
  DOTNET_NUGET_SIGNATURE_VERIFICATION: false

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  android:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lib/dotnet-mls carries the MLS implementation the engine is built on,
          # and Scramble.Core will not compile without it. A shallow checkout
          # without submodules fails here with a missing-symbol error that reads
          # like a code fault — see the handoff's trap table.
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        # Pinned to the same workload set publish.yml uses, for the reasons spelled
        # out there: an unpinned install has resolved to a set whose Mono runtime
        # packs are not on any public feed (NU1102). Keep the two in step — if one
        # is bumped, bump both, and verify the version exists on nuget.org under
        # Microsoft.NET.Workloads.10.0.200 first.
        run: dotnet workload install android --version 10.0.203.1

      - name: Restore
        run: dotnet restore src/Scramble.Mobile.Android/Scramble.Mobile.Android.csproj

      # Debug only, not a Debug/Release matrix. This job answers one question —
      # does the head still compile — and the second configuration doubles the
      # runner cost to answer it twice. publish.yml builds Release at tag time,
      # signed, which is where a Release-only failure would actually surface.
      - name: Build Android head
        run: >
          dotnet build src/Scramble.Mobile.Android/Scramble.Mobile.Android.csproj
          --no-restore --configuration Debug

  smoke:

    name: Android smoke (emulator)
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android --version 10.0.203.1

      # Release, and this is not a preference. A Debug build uses FastDev, which
      # loads managed assemblies one at a time from the filesystem; on a
      # software-rendered emulator that took ~10s on the main thread, Android
      # declared an ANR and SIGKILLed the process. The app was fine -- the
      # startup path was just too slow to survive the 5s rule in that
      # configuration. Reproduced locally: Debug ANRs, Release passes 3/3.
      #
      # Release is also the honest thing to smoke-test: it is what ships, and
      # startup cost is exactly the property being measured. No keystore is
      # needed -- the csproj only activates AndroidKeyStore when
      # AndroidSigningKeyStore is supplied, so this falls back to debug signing,
      # which installs fine on an emulator.
      - name: Build the APK (Release)
        run: >
          dotnet build src/Scramble.Mobile.Android/Scramble.Mobile.Android.csproj
          --configuration Release

      # Without this the emulator falls back to software virtualisation and a
      # cold boot does not finish inside any sane timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator and run the smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # 36, matching the app's targetSdk, and the choice is load-bearing
          # rather than housekeeping.
          #
          # Android enforces edge-to-edge only for apps targeting SDK 35+, and
          # that enforcement is what makes systemBars.Top non-zero -- which is
          # the entire precondition for the v0.7.0 defect that
          # android-tap-alignment.ps1 exists to catch. On API 34 the window is
          # already laid out below the status bar, the safe-area inset is 0, and
          # the defect cannot occur. Measured, not assumed: on the API 34 runner
          # the login tab strip sits at y=248, and on an API 37 device at the
          # same 320x640/160dpi it sits at y=274 -- 26px lower, which is the
          # status-bar height that API 34 never hands the app.
          #
          # So the alignment guard was running where there was nothing to align.
          api-level: 36
          target: google_apis
          arch: x86_64
          # -memory is not a tuning knob here. At the Pixel_9 AVD's default of
          # 2048 MB the app reached a visible window and was then killed by the
          # lowmemorykiller ("min watermark is breached and swap is low"), which
          # presents as a dead process with no exception and no failing command.
          # The script detects that case by name and says so, but the run still
          # fails -- so give it the memory instead.
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect -memory 6144
          disable-animations: true
          # Two checks, and the second exists because the first is not enough.
          # android-smoke proves the app starts and stays up; it passed v0.7.0
          # twice, a build in which every control responded to taps ~8.6mm above
          # where it drew. Starting was never the property in question.
          # android-tap-alignment taps a control and measures whether the redraw
          # lands where the touch did. `&&` so a smoke failure stops there.
          script: >-
            pwsh -NoProfile -File ./scripts/android-smoke.ps1
            -Apk src/Scramble.Mobile.Android/bin/Release/net10.0-android/app.scramble.chat-Signed.apk
            -ScreenshotPath android-smoke.png
            && pwsh -NoProfile -File ./scripts/android-tap-alignment.ps1 -ArtifactDir .

      # On failure this is the fastest way to see what was on screen instead.
      # On failure these are the whole story: android-smoke.png is what was on
      # screen, and tap-before/after plus the two uiautomator dumps are the two
      # coordinate spaces the alignment check compared.
      - name: Upload the screenshots and UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-artifacts
          path: |
            android-smoke.png
            tap-before.png
            tap-after.png
            ui-before.xml
            ui-after.xml
          if-no-files-found: warn
