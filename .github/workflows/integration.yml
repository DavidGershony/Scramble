name: Integration (Ubuntu, required)

# S1: integration suite runs on every PR that touches MLS / Nostr / signer /
# protocol code, or the test infra itself. See ANALYSIS.md STEP 6 and docs/ci-setup.md.
#
# Rationale: for the whole Feb-May 2026 development window, integration tests
# existed in tests/Scramble.Diagnostics/ but were excluded from CI. The
# MIP-00..04 interop tests, cross-MDK relay tests, DeviceSync E2E, and outbox
# model tests all landed reactively (same day as the bug they proved). This
# workflow makes them a merge gate on the paths where regressions actually happened.

# ReactiveUI / Splat NuGet packages have a revoked author signing certificate.
# Linux .NET SDK does full OCSP/CRL checking via OpenSSL, which nuget.config's
# signatureValidationMode=accept cannot suppress. Disable verification entirely
# until the packages are re-signed. Mirrors the fix in publish.yml (f138379).
env:
  DOTNET_NUGET_SIGNATURE_VERIFICATION: false
  # Point tests that use TestRelayConfig.RelayUrl at the docker-compose relay
  # spun up in the `Start relay` step below. Tests that hardcode
  # wss://relay2.angor.io (CrossMdkRelayIntegrationTests,
  # FullStackRelayIntegrationTests, RelayIntegrationTests, RealRelayGroupChatTests)
  # are NOT covered by this override and are excluded from the whitelist below.
  # Migrating those tests to TestRelayConfig is tracked as follow-up tech debt.
  SCRAMBLE_TEST_RELAY: ws://localhost:7777

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/Scramble.Core/**'
      - 'src/Scramble.Presentation/**'
      - 'src/Scramble.Marmot.Abstractions/**'
      - 'src/Scramble.Marmot.Storage.Sqlite/**'
      - 'src/Scramble.Marmot.AppComponents/**'
      - 'src/Scramble.Marmot.Engine/**'
      - 'src/Scramble.Marmot.Identity/**'
      - 'src/Scramble.Nostr.Crypto/**'
      - 'src/Scramble.Marmot.Wire.Nostr/**'
      - 'lib/marmot-cs/**'
      - 'lib/dotnet-mls/**'
      - 'tests/Scramble.Diagnostics/**'
      - 'tests/Scramble.Core.Tests/**'
      - 'tests/Scramble.Marmot.Tests/**'
      - 'tests/Scramble.UI.Tests/**'
      - '.github/workflows/integration.yml'
      - 'docker-compose.test.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/Scramble.Core/**'
      - 'src/Scramble.Presentation/**'
      - 'src/Scramble.Marmot.Abstractions/**'
      - 'src/Scramble.Marmot.Storage.Sqlite/**'
      - 'src/Scramble.Marmot.AppComponents/**'
      - 'src/Scramble.Marmot.Engine/**'
      - 'src/Scramble.Marmot.Identity/**'
      - 'src/Scramble.Nostr.Crypto/**'
      - 'src/Scramble.Marmot.Wire.Nostr/**'
      - 'lib/marmot-cs/**'
      - 'lib/dotnet-mls/**'
      - 'tests/Scramble.Diagnostics/**'
      - 'tests/Scramble.Core.Tests/**'
      - 'tests/Scramble.Marmot.Tests/**'
      - 'tests/Scramble.UI.Tests/**'
      - '.github/workflows/integration.yml'
      - 'docker-compose.test.yml'

jobs:

  integration:
    name: Integration tests (Ubuntu + Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src/Scramble.Native

    - name: Build Rust native shared object
      run: cargo build --release --manifest-path src/Scramble.Native/Cargo.toml

    - name: Copy .so to Desktop project
      run: cp src/Scramble.Native/target/release/libscramble_native.so src/Scramble.Desktop/

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Start relay + Whitenoise containers
      run: docker compose -f docker-compose.test.yml up -d nostr-relay

    # The Dark Matter interop peer. Built from a pinned mdk ref rather than
    # pulled, because upstream publishes no image — which makes this the
    # slowest step in the workflow by a wide margin: a cold cargo release build
    # of the mdk workspace. Docker layer caching is what keeps it off the
    # critical path on repeat runs; if this becomes the reason PRs are slow,
    # move the whole DarkMatterInterop suite to a nightly Ubuntu workflow
    # rather than dropping it, and say so here.
    #
    # The interop tests SKIP when this container is absent, so a failure to
    # build here turns the suite green-but-empty. The explicit readiness check
    # below is what stops that from passing silently.
    # The Marmot reference CLI - the peer that can actually complete an invite
    # and exchange messages. Built from the same pinned mdk ref as the agent.
    # See tests/mdk-cli-docker/Dockerfile for why the other two peers cannot do
    # this job.
    #
    # The interop tests SKIP when this container is absent, so a failed build
    # would turn the suite green-but-empty. The readiness check below is what
    # stops that passing silently, and must not be removed as redundant.
    - name: Build and start the mdk-cli interop peer
      run: |
        docker compose -f docker-compose.test.yml up -d --build mdk-cli
        for i in {1..40}; do
          if docker exec mdk-cli-interop wn --version >/dev/null 2>&1; then
            echo "mdk-cli ready"; exit 0
          fi
          sleep 3
        done
        echo "mdk-cli never came up" >&2
        docker compose -f docker-compose.test.yml logs mdk-cli
        exit 1

    - name: Build and start the wn-agent interop peer
      run: |
        docker compose -f docker-compose.test.yml up -d --build wn-agent
        for i in {1..40}; do
          if docker exec wn-agent-interop test -S /run/marmot-agent/wn-agent.sock 2>/dev/null; then
            echo "wn-agent ready"; exit 0
          fi
          sleep 3
        done
        echo "wn-agent never came up" >&2
        docker compose -f docker-compose.test.yml logs wn-agent
        exit 1

    - name: Wait for relay
      run: |
        for i in {1..30}; do
          if curl -s -o /dev/null -w "%{http_code}" http://localhost:7777 | grep -qE '(200|400|426)'; then
            echo "relay up"; exit 0
          fi
          sleep 1
        done
        echo "relay never came up" >&2
        docker compose -f docker-compose.test.yml logs nostr-relay
        exit 1

    - name: Restore dependencies
      run: dotnet restore Scramble.Desktop.slnf -p:DesktopOnly=true

    - name: Build (Release, DesktopOnly)
      run: dotnet build Scramble.Desktop.slnf --no-restore --configuration Release -p:DesktopOnly=true

    # Whitelist union — future test categories default to NOT required until
    # explicitly opted in here.
    #
    # Excluded categories and why:
    #   - Category=Relay: current members hardcode wss://relay2.angor.io
    #     (CrossMdkRelayIntegrationTests, FullStackRelayIntegrationTests,
    #     RelayIntegrationTests). Cannot run against docker-relay until they
    #     migrate to TestRelayConfig. Runs in nightly instead.
    #   - Category=Integration on tests/Scramble.Core.Tests: same reason —
    #     RealRelayGroupChatTests hardcodes the same URL.
    #   - Category=FullE2E: uses a whitenoise container that isn't reliable
    #     in ephemeral runners.
    #   - Category=WhitenoiseInterop, WebInterop: need external services.
    #
    # What's kept: Native (in-process MDK), MIP-Compliance / ProtocolCompliance
    # (FaultyRelay in-process), plus the shared-UI Integration category on the
    # Diagnostics project (my S2 lifecycle tests + DeviceSync), which uses
    # FaultyRelay and TestRelayConfig respectively.
    - name: Execute Core.Tests integration suite
      run: >
        dotnet test tests/Scramble.Core.Tests/Scramble.Core.Tests.csproj
        --no-build --configuration Release -p:DesktopOnly=true
        --filter "Category=Native"
        --logger "trx;LogFileName=core-integration.trx"
        --results-directory TestResults

    - name: Execute UI.Tests integration suite
      run: >
        dotnet test tests/Scramble.UI.Tests/Scramble.UI.Tests.csproj
        --no-build --configuration Release -p:DesktopOnly=true
        --filter "Category=Integration"
        --logger "trx;LogFileName=ui-integration.trx"
        --results-directory TestResults

    - name: Execute Diagnostics integration suite
      run: >
        dotnet test tests/Scramble.Diagnostics/Scramble.Diagnostics.csproj
        --configuration Release -p:DesktopOnly=true
        --filter "Category=Integration|Category=MIP-Compliance|Category=ProtocolCompliance|Category=EpochSync|Category=DeviceSync|Category=OutboxModel|Category=Notifications|Category=RelayHarness|Category=ExporterSecret|Category=DarkMatterInterop"
        --logger "trx;LogFileName=diagnostics-integration.trx"
        --results-directory TestResults

    - name: Dump relay logs on failure
      if: failure()
      run: docker compose -f docker-compose.test.yml logs nostr-relay

    - name: Dump wn-agent logs on failure
      if: failure()
      run: docker compose -f docker-compose.test.yml logs wn-agent

    - name: Dump mdk-cli logs on failure
      if: failure()
      run: |
        docker compose -f docker-compose.test.yml logs mdk-cli
        docker exec mdk-cli-interop sh -c 'cat /logs/wnd.log 2>/dev/null | tail -200' || true

    - name: Stop containers
      if: always()
      run: docker compose -f docker-compose.test.yml down -v

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: TestResults/*.trx
