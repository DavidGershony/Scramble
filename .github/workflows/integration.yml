name: Integration (Ubuntu, required)

# S1: integration suite runs on every PR that touches MLS / Nostr / signer /
# protocol code, or the test infra itself. See ANALYSIS.md STEP 6 and docs/ci-setup.md.
#
# Rationale: for the whole Feb-May 2026 development window, integration tests
# existed in tests/Scramble.Diagnostics/ but were excluded from CI. The
# MIP-00..04 interop tests, cross-MDK relay tests, DeviceSync E2E, and outbox
# model tests all landed reactively (same day as the bug they proved). This
# workflow makes them a merge gate on the paths where regressions actually happened.

# ReactiveUI / Splat NuGet packages have a revoked author signing certificate.
# Linux .NET SDK does full OCSP/CRL checking via OpenSSL, which nuget.config's
# signatureValidationMode=accept cannot suppress. Disable verification entirely
# until the packages are re-signed. Mirrors the fix in publish.yml (f138379).
env:
  DOTNET_NUGET_SIGNATURE_VERIFICATION: false
  # Point tests that use TestRelayConfig.RelayUrl at the docker-compose relay
  # spun up in the `Start relay` step below. Tests that hardcode
  # wss://relay2.angor.io (CrossMdkRelayIntegrationTests,
  # FullStackRelayIntegrationTests, RelayIntegrationTests, RealRelayGroupChatTests)
  # are NOT covered by this override and are excluded from the whitelist below.
  # Migrating those tests to TestRelayConfig is tracked as follow-up tech debt.
  SCRAMBLE_TEST_RELAY: ws://localhost:7777

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/Scramble.Core/**'
      - 'src/Scramble.Presentation/**'
      - 'src/Scramble.Marmot.Abstractions/**'
      - 'src/Scramble.Marmot.Storage.Sqlite/**'
      - 'src/Scramble.Marmot.AppComponents/**'
      - 'src/Scramble.Marmot.Engine/**'
      - 'src/Scramble.Marmot.Identity/**'
      - 'src/Scramble.Nostr.Crypto/**'
      - 'src/Scramble.Marmot.Wire.Nostr/**'
      - 'lib/dotnet-mls/**'
      - 'tests/Scramble.Diagnostics/**'
      - 'tests/Scramble.Core.Tests/**'
      - 'tests/Scramble.Marmot.Tests/**'
      - 'tests/Scramble.UI.Tests/**'
      - '.github/workflows/integration.yml'
      - 'docker-compose.test.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/Scramble.Core/**'
      - 'src/Scramble.Presentation/**'
      - 'src/Scramble.Marmot.Abstractions/**'
      - 'src/Scramble.Marmot.Storage.Sqlite/**'
      - 'src/Scramble.Marmot.AppComponents/**'
      - 'src/Scramble.Marmot.Engine/**'
      - 'src/Scramble.Marmot.Identity/**'
      - 'src/Scramble.Nostr.Crypto/**'
      - 'src/Scramble.Marmot.Wire.Nostr/**'
      - 'lib/dotnet-mls/**'
      - 'tests/Scramble.Diagnostics/**'
      - 'tests/Scramble.Core.Tests/**'
      - 'tests/Scramble.Marmot.Tests/**'
      - 'tests/Scramble.UI.Tests/**'
      - '.github/workflows/integration.yml'
      - 'docker-compose.test.yml'

jobs:

  integration:
    name: Integration tests (Ubuntu + Docker)
    runs-on: ubuntu-latest

    # Back to 20 now that the mdk image builds are gone -- see the note where
    # they used to be. It was briefly 45 to survive them.
    #
    # What is left, from the step timings on run 36752717220 minus the two
    # removed builds:
    #   checkout + .NET + relay    ~1m
    #   restore + build              45s
    #   UI.Tests integration        3m13s
    #   Diagnostics (no interop)    ~9m
    # which is about 14m, so 20 leaves room for a slow runner without letting a
    # genuine hang burn three quarters of an hour. If this starts timing out
    # again, read the step timings before raising it: last time the number was
    # not the problem.
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Start relay + Whitenoise containers
      run: docker compose -f docker-compose.test.yml up -d nostr-relay

    # REMOVED 2026-10-01: the two mdk interop peers, mdk-cli and wn-agent.
    #
    # Both were built here from a pinned mdk ref because upstream publishes no
    # image, which meant a cold cargo release build of the mdk workspace on
    # every run: 10m14s and 8m09s, measured on run 36752717220. That was
    # 18m23s of a 30m budget spent before a single test ran, and it is why this
    # job sat one to three minutes from its own timeout for weeks.
    #
    # The note that used to live here said layer caching kept this off the
    # critical path on repeat runs. That was never true: GitHub-hosted runners
    # share no Docker layer cache between runs, and nothing here configured
    # buildx with a cache backend. Every run paid the full build.
    #
    # It also said to move the DarkMatterInterop suite to a nightly Ubuntu
    # workflow rather than drop it. Dropped from the required gate instead, by
    # decision: the MDK does not need to be integrated against on every push,
    # and the pipeline being fast matters more right now.
    #
    # What this costs, stated plainly because ANALYSIS.md STEP 6 is the record
    # of what happened the last time Diagnostics sat outside the gate: the
    # DarkMatterInterop tests still exist and still pass locally, but nothing
    # runs them automatically any more, so cross-MDK interop can now rot
    # without CI noticing. They skip rather than fail when the peers are
    # absent, which is what makes this safe to remove and also what makes the
    # rot silent.
    #
    # To run them, bring the peers up and include the category:
    #   docker compose -f docker-compose.test.yml up -d --build mdk-cli wn-agent
    #   dotnet test tests/Scramble.Diagnostics/ --filter "Category=DarkMatterInterop"
    #
    # To put them back in the gate, restore the two steps from 7f1f4aa and add
    # Category=DarkMatterInterop to the Diagnostics filter below -- and give
    # buildx a cache backend at the same time, or this reverts to a job that
    # spends most of its budget building Rust.

    - name: Wait for relay
      run: |
        for i in {1..30}; do
          if curl -s -o /dev/null -w "%{http_code}" http://localhost:7777 | grep -qE '(200|400|426)'; then
            echo "relay up"; exit 0
          fi
          sleep 1
        done
        echo "relay never came up" >&2
        docker compose -f docker-compose.test.yml logs nostr-relay
        exit 1

    - name: Restore dependencies
      run: dotnet restore Scramble.Desktop.slnf -p:DesktopOnly=true

    - name: Build (Release, DesktopOnly)
      run: dotnet build Scramble.Desktop.slnf --no-restore --configuration Release -p:DesktopOnly=true

    # Whitelist union — future test categories default to NOT required until
    # explicitly opted in here.
    #
    # Excluded categories and why:
    #   - Category=Relay: current members hardcode wss://relay2.angor.io
    #     (CrossMdkRelayIntegrationTests, FullStackRelayIntegrationTests,
    #     RelayIntegrationTests). Cannot run against docker-relay until they
    #     migrate to TestRelayConfig. Runs in nightly instead.
    #   - Category=Integration on tests/Scramble.Core.Tests: same reason —
    #     RealRelayGroupChatTests hardcodes the same URL.
    #   - Category=FullE2E: uses a whitenoise container that isn't reliable
    #     in ephemeral runners.
    #   - Category=WhitenoiseInterop, WebInterop: need external services.
    #   - Category=DarkMatterInterop: dropped 2026-10-01. Needed the two mdk
    #     peers, whose image builds were 18m23s of a 30m budget. See the note
    #     where those steps used to be, including what the drop costs and how
    #     to run the suite by hand.
    #
    # What's kept: MIP-Compliance / ProtocolCompliance (FaultyRelay
    # in-process), plus the shared-UI Integration category on the Diagnostics
    # project (S2 lifecycle tests + DeviceSync), which uses FaultyRelay and
    # TestRelayConfig respectively.
    #
    # Category=Native is gone with src/Scramble.Native. There is no
    # Core.Tests step any more: that step filtered Category=Native, the
    # cutover removed the last test carrying it, and a filter matching
    # nothing exits 0 -- so it had become a green step that ran no tests.
    - name: Execute UI.Tests integration suite
      run: >
        dotnet test tests/Scramble.UI.Tests/Scramble.UI.Tests.csproj
        --no-build --configuration Release -p:DesktopOnly=true
        --filter "Category=Integration"
        --logger "trx;LogFileName=ui-integration.trx"
        --results-directory TestResults

    - name: Execute Diagnostics integration suite
      run: >
        dotnet test tests/Scramble.Diagnostics/Scramble.Diagnostics.csproj
        --configuration Release -p:DesktopOnly=true
        --filter "Category=Integration|Category=MIP-Compliance|Category=ProtocolCompliance|Category=EpochSync|Category=DeviceSync|Category=OutboxModel|Category=Notifications|Category=RelayHarness|Category=ExporterSecret"
        --logger "trx;LogFileName=diagnostics-integration.trx"
        --results-directory TestResults

    - name: Dump relay logs on failure
      if: failure()
      run: docker compose -f docker-compose.test.yml logs nostr-relay

    # The wn-agent and mdk-cli log dumps went with the steps that started those
    # peers. Left in, they would have run `docker compose logs` and
    # `docker exec` against containers this job never starts -- quiet on a good
    # day, and on a bad one two confusing empty sections in the log of a failure
    # they cannot explain. Restore them alongside the build steps.

    - name: Stop containers
      if: always()
      run: docker compose -f docker-compose.test.yml down -v

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: TestResults/*.trx
