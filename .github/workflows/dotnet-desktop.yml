name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src/Scramble.Native

    - name: Build Rust native DLL
      run: cargo build --release --manifest-path src/Scramble.Native/Cargo.toml

    - name: Copy DLL to Desktop project
      run: cp src/Scramble.Native/target/release/scramble_native.dll src/Scramble.Desktop/

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Desktop CI does not build the Android target. Pass DesktopOnly=true so
    # Scramble.Core compiles only for net10.0 — its net10.0-android target needs
    # the MDK submodules to ship Android-compatible binaries, which they don't.
    - name: Restore dependencies
      run: dotnet restore Scramble.Desktop.slnf -p:DesktopOnly=true

    - name: Build
      run: dotnet build Scramble.Desktop.slnf --no-restore --configuration ${{ matrix.configuration }} -p:DesktopOnly=true

    - name: Execute Core unit tests
      run: dotnet test tests/Scramble.Core.Tests/Scramble.Core.Tests.csproj --no-build --configuration ${{ matrix.configuration }} --filter "Category!=Relay&Category!=Integration" -p:DesktopOnly=true

    - name: Execute UI unit tests
      run: dotnet test tests/Scramble.UI.Tests/Scramble.UI.Tests.csproj --no-build --configuration ${{ matrix.configuration }} --filter "Category!=Relay&Category!=Integration" -p:DesktopOnly=true

    # S1: pull in Scramble.Diagnostics unit-tier tests (categories that don't
    # require Docker or external services). Whitelist by exclusion — the
    # integration suite is the venue for Integration/MIP-Compliance/etc.
    - name: Execute Diagnostics unit-tier tests
      run: dotnet test tests/Scramble.Diagnostics/Scramble.Diagnostics.csproj --configuration ${{ matrix.configuration }} --filter "Category!=Integration&Category!=Relay&Category!=MIP-Compliance&Category!=ProtocolCompliance&Category!=FullE2E&Category!=EpochSync&Category!=DeviceSync&Category!=OutboxModel&Category!=Notifications&Category!=RelayHarness&Category!=ExporterSecret&Category!=WhitenoiseInterop&Category!=WebInterop" -p:DesktopOnly=true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.configuration }}
        path: |
          src/Scramble.Desktop/bin/${{ matrix.configuration }}/
