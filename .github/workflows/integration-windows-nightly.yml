name: Integration (Windows, nightly)

# Nightly Windows regression run for tests that don't need Docker.
#
# Design note: an earlier version of this workflow tried to run the same
# docker-compose relay + external-relay categories as integration.yml on
# `windows-latest`. That failed because GitHub-hosted windows-latest no
# longer ships Docker Desktop (run 29522490872 died at
# `DockerCli.exe -SwitchLinuxEngine` with 'not recognized'). Rather than
# fight Docker on Windows runners, the nightly is now narrowed to tests
# that don't need any external services:
#
#   * FaultyRelay-backed compliance tests (MIP-Compliance, ProtocolCompliance,
#     RelayHarness, ExporterSecret) — cover MLS lifecycle, protocol
#     conformance, WebSocket wire framing on the actual Windows .NET runtime.
#   * Native tests — exercise the Rust MDK PInvoke bindings against
#     scramble_native.dll on Windows.
#
# What this covers that Ubuntu integration doesn't:
#   * Windows native DLL loading (`scramble_native.dll` vs `.so`)
#   * Path-separator assumptions in test fixtures
#   * DPAPI-backed SecureStorage (SecureStorageTests, unit-tier).
#
# What's explicitly OUT:
#   * Category=FullE2E — uses WhitenoiseDockerClient. Deliberately excluded
#     to keep the nightly independent of any external Whitenoise/MDK
#     out-of-band work in flight.
#   * Category=Relay / DeviceSyncE2E — hardcoded external relay URL.
#   * Category=WhitenoiseInterop / WebInterop — need external services.
#
# ReactiveUI / Splat cert revocation workaround (see publish.yml f138379).
env:
  DOTNET_NUGET_SIGNATURE_VERIFICATION: false

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily
  workflow_dispatch: {}

jobs:

  integration-windows:
    name: Integration tests (Windows, no-Docker)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src/Scramble.Native

    - name: Build Rust native DLL
      run: cargo build --release --manifest-path src/Scramble.Native/Cargo.toml

    - name: Copy DLL to Desktop project
      shell: pwsh
      run: cp src/Scramble.Native/target/release/scramble_native.dll src/Scramble.Desktop/

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Scramble.Desktop.slnf -p:DesktopOnly=true

    - name: Build (Release, DesktopOnly)
      run: dotnet build Scramble.Desktop.slnf --no-restore --configuration Release -p:DesktopOnly=true

    - name: Execute Core.Tests Windows-integration surface
      run: >
        dotnet test tests/Scramble.Core.Tests/Scramble.Core.Tests.csproj
        --no-build --configuration Release -p:DesktopOnly=true
        --filter "Category=Native"

    - name: Execute Diagnostics FaultyRelay + compliance surface
      run: >
        dotnet test tests/Scramble.Diagnostics/Scramble.Diagnostics.csproj
        --configuration Release -p:DesktopOnly=true
        --filter "Category=MIP-Compliance|Category=ProtocolCompliance|Category=RelayHarness|Category=ExporterSecret"
